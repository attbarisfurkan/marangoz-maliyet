<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Maydinwood - Ahşap & CNC Maliyet Hesabı</title>
  <meta name="theme-color" content="#1e293b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href='data:application/json,{"name":"Maydinwood Maliyet","short_name":"Maydinwood","start_url":".","display":"standalone","background_color":"#0f172a","theme_color":"#1e293b","icons":[{"src":"https://via.placeholder.com/192/1e293b/ffffff?text=MW","sizes":"192x192","type":"image/png"}]}'>

  <style>
    :root {
      --bg: #0b1329;
      --card-bg: #17223b;
      --accent: #f59e0b;
      --accent-blue: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #263554;
      --success: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 30px; }

    /* HEADER */
    header {
      background: #0f172a;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .brand h1 { font-size: 1.2rem; color: var(--accent); }
    .brand p { font-size: 0.75rem; color: var(--text-muted); }
    .btn-reset { background: var(--border); color: var(--text); border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; }

    /* TABS */
    .tabs {
      display: flex;
      background: #0f172a;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
      scrollbar-width: none;
    }
    .tab-btn {
      padding: 12px 16px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      white-space: nowrap;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      font-weight: bold;
    }

    /* CONTAINER & CARDS */
    .content { padding: 12px; max-width: 800px; margin: 0 auto; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .card-title { font-size: 0.95rem; font-weight: bold; color: var(--accent); display: flex; align-items: center; gap: 6px; }

    .form-group { margin-bottom: 8px; }
    label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
    input, select {
      width: 100%;
      padding: 8px 10px;
      background: #0b1329;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.85rem;
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }

    .btn-add {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .part-item {
      background: #0b1329;
      border: 1px solid var(--border);
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 8px;
      position: relative;
    }
    .btn-del {
      position: absolute;
      right: 6px;
      top: 6px;
      background: #ef4444;
      color: white;
      border: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 0.7rem;
    }

    .total-banner {
      background: #091020;
      border: 1px solid var(--accent-blue);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }
    .total-price { font-size: 1.1rem; font-weight: bold; color: var(--accent); }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Maydinwood</h1>
    <p>Ahşap & CNC Maliyet Hesabı</p>
  </div>
  <button class="btn-reset" onclick="resetForm()">↺ Sıfırla</button>
</header>

<!-- SEKMELER (TABS) -->
<div class="tabs">
  <button class="tab-btn active" onclick="switchTab(0)">🔔 1. Ahşap & Plaka</button>
  <button class="tab-btn" onclick="switchTab(1)">⚙️ 2. CAD/CAM & CNC</button>
  <button class="tab-btn" onclick="switchTab(2)">🔨 3. Yüzey & İşçilik</button>
  <button class="tab-btn" onclick="switchTab(3)">📊 4. Özet & Teklif</button>
</div>

<div class="content">

  <!-- TAB 1: AHŞAP VE PLAKA -->
  <div class="tab-content active">
    <div class="card">
      <div class="card-header">
        <div class="card-title">📦 Ahşap / Plaka Parçaları</div>
        <button class="btn-add" onclick="addPart()">+ Parça Ekle</button>
      </div>
      <div id="partsContainer"></div>
    </div>

    <div class="card">
      <div class="card-title">🎗️ Kenar Bandı & Ekstra Kaplama</div>
      <div class="grid-2" style="margin-top:8px;">
        <div class="form-group">
          <label>Toplam PVC/Bant (Metre)</label>
          <input type="number" id="tapeMeters" value="0" oninput="calculate()">
        </div>
        <div class="form-group">
          <label>Bant Metre Fiyatı (TL/m)</label>
          <input type="number" id="tapePrice" value="12" oninput="calculate()">
        </div>
      </div>
    </div>

    <div class="total-banner">
      <span>Toplam Malzeme Maliyeti:</span>
      <span class="total-price" id="subMaterial">0.00 TL</span>
    </div>
  </div>

  <!-- TAB 2: CAD/CAM & CNC -->
  <div class="tab-content">
    <div class="card">
      <div class="card-title">⚙️ CNC & Elektrik Otomasyonu</div>
      <div class="grid-2">
        <div class="form-group">
          <label>Spindle Gücü (kW)</label>
          <input type="number" id="spindleKw" value="9" oninput="calculate()">
        </div>
        <div class="form-group">
          <label>Elektrik Birim Fiyatı (TL/kWh)</label>
          <input type="number" id="elecRate" value="4.5" oninput="calculate()">
        </div>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>Kesim Süresi (Dakika)</label>
          <input type="number" id="cncMin" value="30" oninput="calculate()">
        </div>
        <div class="form-group">
          <label>Bıçak Aşınma (TL/Saat)</label>
          <input type="number" id="toolRate" value="100" oninput="calculate()">
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">📐 CAD / CAM Tasarım</div>
      <div class="grid-2">
        <div class="form-group">
          <label>CAD Süresi (Saat)</label>
          <input type="number" id="cadHours" value="1" oninput="calculate()">
        </div>
        <div class="form-group">
          <label>CAD Saat Ücreti (TL)</label>
          <input type="number" id="cadRate" value="300" oninput="calculate()">
        </div>
      </div>
    </div>
  </div>

  <!-- TAB 3: YÜZEY & İŞÇİLİK -->
  <div class="tab-content">
    <div class="card">
      <div class="card-title">🔨 Zımpara, Cila & İşçilik</div>
      <div class="grid-2">
        <div class="form-group">
          <label>Zımpara / Yağ / Cila (TL)</label>
          <input type="number" id="finishCost" value="150" oninput="calculate()">
        </div>
        <div class="form-group">
          <label>Hırdavat / Aksesuar (TL)</label>
          <input type="number" id="hardwareCost" value="100" oninput="calculate()">
        </div>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>Montaj Süresi (Saat)</label>
          <input type="number" id="laborHours" value="2" oninput="calculate()">
        </div>
        <div class="form-group">
          <label>İşçilik Saat Ücreti (TL)</label>
          <input type="number" id="laborRate" value="200" oninput="calculate()">
        </div>
      </div>
    </div>
  </div>

  <!-- TAB 4: ÖZET & TEKLİF -->
  <div class="tab-content">
    <div class="card">
      <div class="card-title">📊 Fiyatlandırma & KDV</div>
      <div class="grid-2">
        <div class="form-group">
          <label>Kâr Marjı (%)</label>
          <input type="number" id="profitPercent" value="50" oninput="calculate()">
        </div>
        <div class="form-group">
          <label>KDV Oranı (%)</label>
          <select id="vatPercent" onchange="calculate()">
            <option value="20" selected>%20 KDV</option>
            <option value="10">%10 KDV</option>
            <option value="0">%0 Muaf</option>
          </select>
        </div>
      </div>
    </div>

    <div class="total-banner" style="border-color: var(--success);">
      <div>
        <div style="font-size:0.8rem; color:var(--text-muted)">Nihai Satış Tutarı (KDV Dahil):</div>
        <div class="total-price" id="finalTotal" style="color:var(--success); font-size:1.4rem;">0.00 TL</div>
      </div>
    </div>
  </div>

</div>

<script>
  function switchTab(idx) {
    document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
    document.querySelectorAll('.tab-content').forEach((c, i) => c.classList.toggle('active', i === idx));
  }

  let partId = 0;
  function addPart() {
    partId++;
    const div = document.createElement('div');
    div.className = 'part-item';
    div.id = 'part_' + partId;
    div.innerHTML = `
      <button class="btn-del" onclick="removePart(${partId})">✕</button>
      <div class="grid-2">
        <div class="form-group"><label>En (mm)</label><input type="number" class="p-w" value="1200" oninput="calculate()"></div>
        <div class="form-group"><label>Boy (mm)</label><input type="number" class="p-h" value="800" oninput="calculate()"></div>
      </div>
      <div class="grid-3">
        <div class="form-group"><label>Adet</label><input type="number" class="p-qty" value="1" oninput="calculate()"></div>
        <div class="form-group"><label>Plaka (TL)</label><input type="number" class="p-price" value="2500" oninput="calculate()"></div>
        <div class="form-group"><label>Fire (%)</label><input type="number" class="p-waste" value="15" oninput="calculate()"></div>
      </div>
    `;
    document.getElementById('partsContainer').appendChild(div);
    calculate();
  }

  function removePart(id) {
    const el = document.getElementById('part_' + id);
    if(el) el.remove();
    calculate();
  }

  function calculate() {
    let matTotal = 0;
    document.querySelectorAll('.part-item').forEach(item => {
      const w = parseFloat(item.querySelector('.p-w').value) || 0;
      const h = parseFloat(item.querySelector('.p-h').value) || 0;
      const qty = parseFloat(item.querySelector('.p-qty').value) || 1;
      const price = parseFloat(item.querySelector('.p-price').value) || 0;
      const waste = parseFloat(item.querySelector('.p-waste').value) || 0;

      const areaM2 = (w * h / 1000000) * qty;
      const boardArea = 2.8 * 2.1; // Standart Plaka
      const cost = (areaM2 / boardArea) * price * (1 + waste/100);
      matTotal += cost;
    });

    const tapeM = parseFloat(document.getElementById('tapeMeters').value) || 0;
    const tapeP = parseFloat(document.getElementById('tapePrice').value) || 0;
    matTotal += (tapeM * tapeP);

    document.getElementById('subMaterial').innerText = matTotal.toFixed(2) + " TL";

    // CNC & İşçilik
    const kw = parseFloat(document.getElementById('spindleKw').value) || 0;
    const elecR = parseFloat(document.getElementById('elecRate').value) || 0;
    const cncM = parseFloat(document.getElementById('cncMin').value) || 0;
    const elecCost = (kw * (cncM/60)) * elecR;

    const cadH = parseFloat(document.getElementById('cadHours').value) || 0;
    const cadR = parseFloat(document.getElementById('cadRate').value) || 0;
    const cadCost = cadH * cadR;

    const finish = parseFloat(document.getElementById('finishCost').value) || 0;
    const hard = parseFloat(document.getElementById('hardwareCost').value) || 0;
    const labH = parseFloat(document.getElementById('laborHours').value) || 0;
    const labR = parseFloat(document.getElementById('laborRate').value) || 0;
    const laborCost = labH * labR;

    const baseTotal = matTotal + elecCost + cadCost + finish + hard + laborCost;

    const profit = parseFloat(document.getElementById('profitPercent').value) || 0;
    const vat = parseFloat(document.getElementById('vatPercent').value) || 0;

    const subWithProfit = baseTotal * (1 + profit/100);
    const final = subWithProfit * (1 + vat/100);

    document.getElementById('finalTotal').innerText = final.toFixed(2) + " TL";
  }

  // İlk parça varsayılan eklenir
  window.onload = () => { addPart(); };

  // Otomatik Önbellek Yenileme (PWA Otomatik Güncelleme)
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(registrations => {
      for (let registration of registrations) {
        registration.update();
      }
    });
  }
</script>
</body>
</html>
